<title>ことば手帖｜日語 1–6 課有聲自主學習</title>
<style>
:root{--ink:#12263a;--paper:#f6f4ed;--red:#e64b2f;--blue:#1976a3;--matcha:#527c4b;--gold:#d9a928;--muted:#58697a;--line:#d9ddd8;--soft:#e9efe9;--shadow:0 14px 36px rgba(18,38,58,.10)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic","Noto Sans CJK JP","Noto Sans JP","Microsoft JhengHei",system-ui,sans-serif;line-height:1.55;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
h1,h2,h3{margin:0}.hidden{display:none!important}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;background:var(--ink);color:#fff;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:900;margin-right:auto;border:0;background:none;color:#fff;padding:0}
.stamp{width:36px;height:36px;border:2.5px solid #fff;border-radius:50%;display:grid;place-items:center;transform:rotate(-7deg);font-size:18px}
.back{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:8px 14px;font-weight:800;min-height:44px}
.top-btn{white-space:nowrap;flex:none;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:99px;padding:8px 14px;font-weight:800;min-height:44px}
main{max-width:920px;margin:0 auto;padding:22px 18px 30px}
.eyebrow{color:var(--red);font-size:12px;font-weight:900;letter-spacing:.18em}
.lead{color:var(--muted);margin:6px 0 0;text-wrap:pretty}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:900;background:var(--ink);color:#fff;min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.red{background:var(--red)}.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{background:#c9d0cc;color:#fff;cursor:default}
.spk{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--blue);display:inline-grid;place-items:center;flex:none;padding:0}
.spk svg{width:22px;height:22px;pointer-events:none}
.spk.lg{width:96px;height:96px;background:var(--blue);color:#fff;border:0;box-shadow:0 10px 24px rgba(25,118,163,.3)}.spk.lg svg{width:44px;height:44px}
.spk.playing{box-shadow:0 0 0 6px rgba(25,118,163,.22)}
.hero{background:#fbfaf5;border:1px solid var(--line);border-radius:20px;padding:30px 32px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;box-shadow:var(--shadow)}
.hero-l{display:grid;gap:12px;align-content:center;min-width:0}
.hero-rule{width:44px;height:3px;background:var(--red)}
.hero h1{font-size:clamp(28px,6vw,40px);line-height:1.25}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.chip{white-space:nowrap;flex:none;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-weight:800;font-size:14px;min-height:42px}
.chip:hover{border-color:var(--ink)}.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.hero-r{display:flex;gap:12px;align-items:stretch}
.vt{writing-mode:vertical-rl;font-size:clamp(40px,8vw,64px);font-weight:900;line-height:1;letter-spacing:.06em;margin:0}
.hstamp{width:40px;height:40px;background:var(--red);color:#fff;border-radius:6px;display:grid;place-items:center;font-weight:900;font-size:20px;align-self:flex-end}
.hello{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:24px;display:grid;gap:10px}
.hello h1{font-size:clamp(28px,6vw,42px);line-height:1.15}
.meter{height:8px;background:#e3e8e2;border-radius:99px;overflow:hidden;margin-top:8px}.meter i{display:block;height:100%;background:var(--matcha)}
.small{font-size:13px;color:var(--muted)}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:6px}
.how div{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:700}
.how b{display:block;color:var(--red);font-size:12px;letter-spacing:.1em}
.sec-title{font-size:18px;margin:28px 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-title small{color:var(--muted);font-weight:400;font-size:13px}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.lcard{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 14px;align-items:center;width:100%}
.lcard:hover{box-shadow:var(--shadow);border-color:#b9c3bd}
.lno{grid-row:span 2;width:48px;height:48px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;flex:none}
.lcard b{font-size:16px}.lcard span.s{font-size:13px;color:var(--muted)}
.dots{grid-column:1/-1;display:flex;gap:4px;margin-top:10px}.dots i{flex:1;height:5px;border-radius:9px;background:#e6eae5}.dots i.on{background:var(--matcha)}
.lhead{display:flex;gap:14px;align-items:center}
.lhead h1{font-size:clamp(22px,4.6vw,32px);line-height:1.2}
.path{display:grid;gap:10px;margin-top:18px}
.step{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 16px;text-align:left;width:100%}
.step .n{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;color:var(--muted)}
.step.done .n{background:var(--matcha);border-color:var(--matcha);color:#fff}
.step.next{border:2px solid var(--red);box-shadow:var(--shadow)}.step.next .n{border-color:var(--red);color:var(--red)}
.step b{display:block;font-size:16px}.step small{color:var(--muted);font-size:13px;display:block}
.tests{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.step .go{font-weight:900;font-size:14px;color:var(--muted)}.step.next .go{color:var(--red)}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--muted);font-weight:800}
.prog{height:8px;background:#e3e8e2;border-radius:99px;overflow:hidden;margin:8px 0 16px}.prog i{display:block;height:100%;background:var(--red);transition:width .3s}
.qcard{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:26px 20px;text-align:center;display:grid;gap:12px;justify-items:center}
.ask{font-size:15px;font-weight:800;color:var(--blue)}
ruby{ruby-position:over}rt{font-size:.5em;font-weight:700;color:var(--blue);letter-spacing:0}
.jp{font-size:clamp(34px,8vw,56px);font-weight:900;line-height:1.5;overflow-wrap:anywhere}
.reading{color:var(--muted);font-size:18px}
.zh{font-size:clamp(24px,6vw,36px);font-weight:900;line-height:1.3}
.sentence{font-size:clamp(20px,4.8vw,28px);font-weight:800;line-height:2.1;text-wrap:pretty}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--red);color:var(--red);padding:0 4px}
.tr{color:var(--muted);font-size:15px}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.ans{min-height:64px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font-size:18px;font-weight:800;text-align:left;display:flex;gap:12px;align-items:center}
.ans .k{width:28px;height:28px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:13px;flex:none;color:var(--muted)}
.ans:hover:not(:disabled){border-color:var(--blue)}
.ans:disabled{cursor:default;color:var(--ink)}
.ans.correct{border-color:var(--matcha);background:#edf6ea}.ans.correct .k{background:var(--matcha);color:#fff}
.ans.wrong{border-color:var(--red);background:#fdeeea}.ans.wrong .k{background:var(--red);color:#fff}
.ans.dim{opacity:.5}
.fb{margin-top:14px;border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;font-weight:700;text-align:left}
.fb.good{background:#edf6ea;color:#2f5a2a}.fb.bad{background:#fdeeea;color:#9c2b15}.fb .t{flex:1;min-width:0}
.type{width:100%;max-width:440px;font-size:22px;padding:14px;border:2px solid var(--line);border-radius:14px;text-align:center;background:#fff}
.type:focus{outline:none;border-color:var(--blue)}.type.ok{border-color:var(--matcha);background:#edf6ea}.type.ng{border-color:var(--red);background:#fdeeea}
.cat{font-size:12px;font-weight:800;color:#27536a;background:#eef4f7;border-radius:6px;padding:3px 8px}
.match{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
.mcol{display:grid;gap:10px;align-content:start}
.mc{min-height:58px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-weight:800;font-size:16px}
.mc.sel{border-color:var(--blue);background:#eaf3f8}.mc.ok{opacity:.35;border-color:var(--matcha);background:#edf6ea}.mc.bad{border-color:var(--red);background:#fdeeea}
.toolbar{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin:16px 0 12px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:700;min-height:44px;cursor:pointer}.chk input{width:20px;height:20px;accent-color:var(--red)}
.wlist{display:grid;gap:8px}
.wrow{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;transition:background .2s}
.wrow .no{color:var(--muted);font-size:13px;font-weight:800;text-align:center}
.wrow b{font-size:19px;line-height:1.7}.wrow small{display:block;color:var(--muted);font-size:14px}
.wrow.playing{border-color:var(--red);background:#fff6f3}
.score{font-size:76px;font-weight:900;line-height:1;color:var(--matcha)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,255,255,.97);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(18,38,58,.08);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar-in{max-width:920px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar-hint{flex:1;color:var(--muted);font-size:14px;font-weight:700;min-width:0}
.bar .main{flex:0 1 360px;font-size:18px;min-height:56px}
.attn{animation:attn 1.2s ease-in-out infinite}
@keyframes attn{50%{transform:scale(1.04)}}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(18,38,58,.45);display:grid;align-items:end;justify-items:center}
.sheet-in{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));display:grid;gap:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lab{font-weight:800;margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{min-height:46px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-weight:800}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.voice{display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:14px;padding:12px 14px}
.voice div{flex:1;min-width:0}.voice small{display:block;color:var(--muted);font-size:13px}
#envBanner:empty{display:none}
.env-banner{max-width:920px;margin:14px auto 0;padding:14px 16px;border-radius:14px;background:#fff7e3;border:1px solid #ecd28b;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.env-wrap{padding:0 18px}
.env-text{display:grid;gap:3px;min-width:0;flex:1 1 280px}.env-text span{font-size:13.5px;color:var(--muted)}
.env-actions{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:50;display:none;max-width:90vw;text-align:center}
@media(min-width:700px){.sheet{align-items:center}.sheet-in{border-radius:20px}}
@media(max-width:620px){
.hero{padding:22px 20px;gap:12px}.vt{font-size:40px}.hstamp{width:32px;height:32px;font-size:16px}
main{padding:16px 14px 24px}.env-wrap{padding:0 14px}
.answers{grid-template-columns:1fr}.ans{min-height:56px;font-size:17px}
.bar-hint{display:none}.bar .main{flex:1 1 auto}
.how{grid-template-columns:1fr}
.qcard{padding:22px 14px}.brand span{display:none}
}
</style>

function pool(L){return L==='all'?V:L==='mist'?V.filter(x=>S.mistakes.indexOf(x.id)>=0):V.filter(x=>String(x.lesson)===String(L))}
function clozeFor(L){return DATA.cloze.filter(c=>L==='all'||String(c.lesson)===String(L))}
function exprFor(L){const ls=L==='all'?[1,2,3,4,5,6]:[+L];const r=[];ls.forEach(n=>(DATA.expressions[n]||[]).forEach(e=>r.push({say:kanaT(e[0]),jp:e[0],zh:e[1],lesson:n})));return r}
const KJ=/[\u4e00-\u9fff々〆ヶ]/;
function toH(s){return s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60))}
function rb(k,r){return '<ruby>'+k+'<rt>'+r+'</rt></ruby>'}
function alignParts(jp,rd){const parts=jp.split(/([\u4e00-\u9fff々〆ヶ]+)/).filter(Boolean);let re='^';
 parts.forEach(p=>{re+=KJ.test(p)?'(.+?)':toH(p).replace(/\s+/g,'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&')});
 const m=toH(rd).replace(/\s+/g,'').match(new RegExp(re+'$'));if(!m)return null;let i=1;return parts.map(p=>KJ.test(p)?[p,m[i++]]:[p])}
const DICT={};const FV={};
function furiV(x){if(FV[x.id])return FV[x.id];let h;if(!KJ.test(x.jp))h=esc(x.jp);else{
 const js=x.jp.split(/[（）]/).filter(Boolean),rs=x.reading.split(/[（）]/).filter(Boolean);
 const out=js.map((j,i)=>{const a=alignParts(j,rs[i]||rs[0]);return a?a.map(p=>p[1]?rb(esc(p[0]),p[1]):esc(p[0])).join(''):rb(esc(j),rs[i]||rs[0])});
 h=out.length>1?out[0]+'（'+out.slice(1).join('）（')+'）':out[0]}return FV[x.id]=h}
V.forEach(x=>{if(!KJ.test(x.jp))return;const js=x.jp.split(/[（）]/).filter(Boolean),rs=x.reading.split(/[（）]/).filter(Boolean);
 js.forEach((j,i)=>{const a=alignParts(j,rs[i]||rs[0]);if(a)a.forEach(p=>{if(p[1]&&!DICT[p[0]])DICT[p[0]]=p[1]})})});
Object.assign(DICT,{'願':'ねが','元気':'げんき','何語':'なにご','階':'かい','半':'はん','大阪':'おおさか','京都':'きょうと','公園':'こうえん','失礼':'しつれい','名前':'なまえ','世話':'せわ','大変':'たいへん','番号':'ばんごう','何番線':'なんばんせん','次':'つぎ','普通':'ふつう','初':'はじ','甲子園':'こうしえん','電車':'でんしゃ','何時':'なんじ'});
function seg(run){if(DICT[run])return rb(run,DICT[run]);let out='',i=0;while(i<run.length){let j=run.length;for(;j>i;j--){if(DICT[run.slice(i,j)])break}
 if(j===i){out+=run[i];i++}else{out+=rb(run.slice(i,j),DICT[run.slice(i,j)]);i=j}}return out}
function furiT(text){return esc(text).replace(/(\d+)?([\u4e00-\u9fff々〆ヶ]+)/g,(all,d,run,off,str)=>{d=d||'';const prev=str[off-1]||'';
 if(d==='20'&&run==='日')return rb('20日','はつか');
 if(run==='人')return d+rb('人',d?'にん':/[ァ-ヶー]/.test(prev)?'じん':'ひと');
 if(d&&run==='階')return d+rb('階',d==='3'?'がい':'かい');
 return d+seg(run)})}
function kanaT(text){return furiT(text).replace(/<ruby>.*?<rt>(.*?)<\/rt><\/ruby>/g,'$1').replace(/&amp;/g,'&').replace(/&#39;/g,"'").replace(/&quot;/g,'"')}
function lessonName(L){return L==='all'?'六課綜合':L==='mist'?'錯題本':'第 '+L+' 課'}
function stepState(L,k){return S.steps[L+':'+k]}
function markStep(L,k,pct){const key=L+':'+k,o=S.steps[key]||{};o.done=true;o.best=Math.max(o.best||0,pct);S.steps[key]=o;save()}
function doneCount(L){return stepsFor(L).filter(s=>stepState(L,s.k)).length}
function nextStepIdx(L){const st=stepsFor(L);const i=st.findIndex(s=>!stepState(L,s.k));return i<0?null:i}
function masteryPct(items){if(!items.length)return 0;return Math.round(items.reduce((a,x)=>a+Math.min(3,S.mastery[x.id]||0),0)/(items.length*3)*100)}
function record(it,ok){if(!it||it.id==null)return;if(ok){S.mastery[it.id]=(S.mastery[it.id]||0)+1;if(S.mastery[it.id]>=2)S.mistakes=S.mistakes.filter(id=>id!==it.id)}
 else if(S.mistakes.indexOf(it.id)<0)S.mistakes.push(it.id);save()}

 const last=S.last;setBar(last&&TITLES[last.L]?{hint:'上次練到：'+lessonName(last.L),main:{label:'繼續學習：'+lessonName(last.L)+' →',act:'go',to:'#/L'+last.L}}:{hint:'第一次使用？從第 1 課開始',main:{label:'從第 1 課開始 →',act:'go',to:'#/L1'}})}

/* ---------- 課程步驟頁 ---------- */
function vLesson(L){setBack('首頁','#/');const items=pool(L),st=stepsFor(L);
 if(L==='mist'&&!items.length){view(`<div class="hello"><h1>錯題本是空的</h1><p class="lead">練習時答錯的單字會自動放進這裡，之後可以集中複習。</p></div>`);setBar({main:{label:'回首頁',act:'go',to:'#/'}});return}
 const learn=st.filter(s=>LEARN.indexOf(s.k)>=0),tests=st.filter(s=>LEARN.indexOf(s.k)<0);
 const nl=learn.find(s=>!stepState(L,s.k));

  return `<button class="step ${o?'done':''} ${isN?'next':''}" data-act="go" data-to="#/L${L}/${s.k}"><span class="n">${o?'✓':i+1}</span><span><b>${s.name}</b><small>${s.desc}${best}</small></span><span class="go">${isN?'開始 →':o?'再練':'›'}</span></button>`};
 view(`<div class="lhead"><span class="lno" style="background:${L==='mist'?'var(--gold)':L==='all'?'var(--ink)':COLORS[(+L-1)%3]}">${L==='all'?'綜':L==='mist'?'錯':L}</span><div style="flex:1;min-width:0"><div class="eyebrow">${lessonName(L)}・${items.length} 個單字</div><h1>${/^\d$/.test(L)?furiT(TITLES[L]):esc(TITLES[L])}</h1></div>${/^\d$/.test(L)?spk(kanaT(TITLES[L])):''}</div>
 <h2 class="sec-title">學習 <small>建議先聽熟單字</small></h2><div class="path" style="margin-top:0">${learn.map((s,i)=>row(s,i,nl&&s.k===nl.k)).join('')}</div>
 <h2 class="sec-title">測驗 <small>可依自己的意願，自由選擇先後順序</small></h2><div class="tests">${tests.map((s,i)=>row(s,i,false)).join('')}</div>`);
 const td=tests.filter(s=>stepState(L,s.k)).length;
 if(nl)setBar({hint:'測驗可隨時直接點選',main:{label:'開始：'+nl.name+' →',act:'go',to:'#/L'+L+'/'+nl.k}});
 else{const left=tests.filter(s=>!stepState(L,s.k)),pk=(left.length?left:tests)[Math.floor(Math.random()*(left.length||tests.length))];
  setBar({hint:'已完成測驗 '+td+' / '+tests.length+'，請點選想做的測驗',main:{label:'隨機挑一項測驗 →',act:'go',to:'#/L'+L+'/'+pk.k}})}}

/* ---------- 開始步驟 ---------- */
function startStep(L,k){stopAll();Object.assign(R,{L,step:k,i:0,score:0,wrong:[],errors:0,rev:false,locked:false});S.last={L,k};save();
 setBack(lessonName(L),'#/L'+L);window.scrollTo(0,0);const items=pool(L);
 if(k==='list'){AUTO.items=items.map(x=>({say:x.reading,zh:x.zh}));AUTO.i=0;return vRead('單字表',items.map(x=>({html:furiV(x),sub:x.reading+'・'+x.zh})))}
 if(k==='expr'){AUTO.items=exprFor(L);AUTO.i=0;return vRead('實用會話',AUTO.items.map(x=>({html:furiT(x.jp),sub:x.zh+(L==='all'?'・L'+x.lesson:'')})))}
 if(k==='flash'){R.q=L==='all'?shuffle(items).slice(0,20):items.slice();return vFlash()}
 if(k==='matching'){const s=shuffle(items),n=s.length>=12?2:1;R.q=[];for(let r=0;r<n;r++)R.q.push(s.slice(r*6,r*6+6));R.total=R.q.reduce((a,x)=>a+x.length,0);return vMatch()}
 if(k==='context'){R.q=shuffle(clozeFor(L)).slice(0,10);return vQ()}

 <div class="wlist">${rows.map((x,i)=>`<div class="wrow" data-i="${i}" data-say="${esc(AUTO.items[i].say)}"><span class="no">${i+1}</span><div><b>${x.html}</b><small>${esc(x.sub)}</small></div>${spk(AUTO.items[i].say)}</div>`).join('')}</div>`);

function vQ(){if(R.i>=R.q.length)return vResult();R.locked=false;R.tok++;
 const k=R.step,it=R.q[R.i];let body='',opts=null,autoSay=null;
 if(k==='context'){const filled=it.text.replace(/（\s*）/,it.answer);
  R.cur={v:it.answer,item:null,say:kanaT(filled),fb:`<b>${furiT(filled)}</b><br>${esc(it.zh)}`,show:{html:furiT(filled),say:kanaT(filled),sub:it.zh}};
  body=`<div class="ask">選出（　）中正確的詞</div><div class="sentence">${furiT(it.text).replace(/（\s*）/,'<span class="blank">？</span>')}</div><div class="tr">${esc(it.zh)}</div>${spk(kanaT(it.text))}`;
  const pre=(it.text.match(/(.)（\s*）/)||[])[1]||'';opts=shuffle(it.options).map(o=>({v:o,label:o,html:furiT(pre+o).slice(esc(pre).length)}))}
 else{R.cur={v:String(it.id),item:it,say:it.reading,fb:`<b>${furiV(it)}</b>（${esc(it.reading)}）＝${esc(it.zh)}`,show:{html:furiV(it),say:it.reading,sub:it.reading+'・'+it.zh}};
  if(k==='listening'){body=`<div class="ask">聽發音，選出中文意思</div>${spk(it.reading,'lg')}<div class="small">聽不清楚可以再按一次</div>`;opts=mkOpts(it,'zh');autoSay=it.reading}
  if(k==='meaning'){body=`<div class="ask">這個日文是什麼意思？</div><div class="jp">${furiV(it)}</div><div class="reading">${esc(it.reading)}</div>${spk(it.reading)}`;opts=mkOpts(it,'zh');autoSay=it.reading}
  if(k==='reverse'){body=`<div class="ask">哪一個日文是這個意思？</div><div class="zh">${esc(it.zh)}</div><div class="small">選完會播放正確發音</div>`;opts=mkOpts(it,'jp')}
  if(k==='typing'){body=`<div class="ask">聽發音，用假名打出來</div>${spk(it.reading,'lg')}<div class="small">提示：${esc(it.zh)}</div><input class="type" id="typeIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="在這裡輸入假名" lang="ja">`;autoSay=it.reading}}
 view(phead(R.i,R.q.length,(R.i+1)+' / '+R.q.length+'・答對 '+R.score)+`<div class="qcard">${body}</div>`+(opts?`<div class="answers">${opts.map((o,j)=>`<button class="ans" data-act="pick" data-v="${esc(o.v)}"><span class="k">${j+1}</span><span>${o.html||esc(o.label)}</span></button>`).join('')}</div>`:'')+'<div id="fb"></div>');
 const sec=k==='reverse'?[]:[{label:'再聽一次',act:'replay'}];
 if(k==='typing'){setBar({hint:'輸入後按 Enter 或「確認答案」',sec,main:{label:'確認答案',act:'check'}});const ti=$('#typeIn');if(!('ontouchstart' in window))ti.focus()}

 if(autoSay){const b=$('#view .spk');setTimeout(()=>say(autoSay,b),300)}}
function mkOpts(it,field){const p=pool(R.L),base=p.length>=4?p:V,seen={};seen[it[field]]=1;
 const others=shuffle(base.filter(x=>x.id!==it.id)).filter(x=>{if(seen[x[field]])return false;seen[x[field]]=1;return true}).slice(0,3);
 return shuffle([it].concat(others)).map(x=>({v:String(x.id),label:x[field],html:field==='jp'?furiV(x):esc(x[field])}))}

function normalize(s){return String(s).trim().replace(/[\s・。．,，、]/g,'').replace(/（.*?）|\(.*?\)/g,'').replace(/[ァ-ヶ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60)).replace(/[～~]/g,'').toLowerCase()}

/* 配對 */
function vMatch(){if(R.i>=R.q.length)return vResult();const set=R.q[R.i];R.m={selL:null,selR:null,done:0,n:set.length};

 setBar({hint:'已配對 0 / '+set.length,main:{label:'配對完成後繼續',disabled:true}})}
function matchPick(side,b){const m=R.m;if(b.disabled)return;
 $$('.mc[data-act='+(side==='L'?'mL':'mR')+']').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
 if(side==='L'){m.selL=b;const it=V.find(x=>String(x.id)===b.dataset.id);say(it.reading)}else m.selR=b;
 if(!(m.selL&&m.selR))return;const a=m.selL,c=m.selR;m.selL=m.selR=null;
 if(a.dataset.id===c.dataset.id){[a,c].forEach(x=>{x.classList.remove('sel');x.classList.add('ok');x.disabled=true});m.done++;R.score++;
  const it=V.find(x=>String(x.id)===a.dataset.id);record(it,true);if(side==='R')say(it.reading);
  if(m.done===m.n){const last=R.i+1>=R.q.length;setBar({hint:'這一組全部配對完成！',main:{label:last?'看結果 →':'下一組 →',act:'nextRound'}})}
  else setBar({hint:'已配對 '+m.done+' / '+m.n,main:{label:'配對完成後繼續',disabled:true}})}
 else{R.errors++;[a,c].forEach(x=>{x.classList.remove('sel');x.classList.add('bad')});setTimeout(()=>[a,c].forEach(x=>x.classList.remove('bad')),600)}}

/* 結果 */
function vResult(){const k=R.step;let pct,line;
 if(k==='matching'){pct=R.total?Math.round(R.total/(R.total+R.errors)*100):0;line='配對 '+R.total+' 組・配錯 '+R.errors+' 次'}
 else if(k==='flash'){pct=R.q.length?Math.round(R.score/R.q.length*100):0;line='記住 '+R.score+' / '+R.q.length+' 個'}
 else{pct=R.q.length?Math.round(R.score/R.q.length*100):0;line='答對 '+R.score+' / '+R.q.length+' 題'}
 markStep(R.L,k,pct);const msg=pct>=90?'すばらしい！':pct>=70?'いいですね！':'もう一度 がんばりましょう！';
 const si=stepInfo(),ns=stepsFor(R.L)[si.i+1],seen={},wrong=R.wrong.filter(w=>{const key=w.html;if(seen[key])return false;seen[key]=1;return true});
 view(`<div class="qcard"><div class="ask">${si.s.name}・完成</div><div class="score" style="color:${pct>=70?'var(--matcha)':'var(--red)'}">${pct}%</div><div class="row" style="gap:10px"><h2>${msg}</h2>${spk(msg)}</div><div class="small">${line}${wrong.length?'・需要加強的字已放進錯題本':''}</div></div>
 ${wrong.length?`<h2 class="sec-title">再聽一次這些字</h2><div class="wlist">${wrong.map((w,i)=>{const s=w.say;return `<div class="wrow" data-say="${esc(s)}"><span class="no">${i+1}</span><div><b>${w.html}</b><small>${esc(w.sub)}</small></div>${spk(s)}</div>`}).join('')}</div>`:''}`);
 const menu={label:R.step==='flash'?'去選擇測驗 →':'選擇其他測驗 →',act:'go',to:'#/L'+R.L};
 if(pct<60)setBar({hint:'建議再練一次',sec:[{label:'回課程選單',act:'lesson'}],main:{label:'再練一次',act:'retry'}});
 else setBar({hint:'做得好！',sec:[{label:'再練一次',act:'retry'}],main:menu});
 window.scrollTo(0,0);setTimeout(()=>say(msg,$('#view .spk')),300)}
function goNextStep(){const st=stepsFor(R.L),i=st.findIndex(s=>s.k===R.step);if(i<st.length-1)go('#/L'+R.L+'/'+st[i+1].k);else go('#/L'+R.L)}

/* 查單字 */
function nz(s){return toH(String(s)).toLowerCase().replace(/[\s～~（）()・、。]/g,'')}
function vSearch(){setBack('首頁','#/');setBar(null);R.sl=R.sl||'all';
 view(`<h1 style="font-size:26px">查單字</h1><p class="lead">輸入日文、假名或中文，可查第 1–6 課所有單字。點任一列就會播放發音。</p>
 <input class="type" id="sq" type="search" placeholder="例如：がくせい、学生、學生" value="${esc(R.sq||'')}" autocomplete="off" autocapitalize="off" spellcheck="false" lang="ja" style="max-width:none;text-align:left;margin-top:14px">
 <div class="chips" id="sl" style="margin:12px 0">${['all','1','2','3','4','5','6'].map(l=>`<button class="chip ${R.sl===l?'on':''}" data-act="sl" data-v="${l}">${l==='all'?'全部':'第 '+l+' 課'}</button>`).join('')}</div>
 <div class="small" id="scount"></div><div class="wlist" id="sres" style="margin-top:8px"></div>`);
 const i=$('#sq');i.oninput=()=>{R.sq=i.value;renderSearch()};if(!('ontouchstart' in window))i.focus();renderSearch()}
function renderSearch(){const q=nz(R.sq||'');let list=V.filter(x=>R.sl==='all'||String(x.lesson)===R.sl);
 if(q)list=list.filter(x=>nz(x.jp).indexOf(q)>=0||nz(x.reading).indexOf(q)>=0||nz(x.zh).indexOf(q)>=0);
 $('#scount').textContent=(q?'找到 ':'共 ')+list.length+' 個單字';
 $('#sres').innerHTML=list.length?list.map(x=>`<div class="wrow" data-say="${esc(x.reading)}"><span class="no">L${x.lesson}</span><div><b>${furiV(x)}</b><small>${esc(x.reading)}・${esc(x.zh)}</small></div>${spk(x.reading)}</div>`).join(''):'<div class="hello"><b>找不到符合的單字</b><span class="small">試試輸入假名或中文的一部分。</span></div>'}

/* 設定 */
function voiceStatus(){if(!HAS_TTS)return '此瀏覽器不支援語音，請改用 Chrome、Edge 或 Safari。';loadVoices();if(TTS.ja)return '使用中：'+TTS.ja.name;if(TTS.count===0)return '使用系統預設語音';return '尚未安裝日文語音。'+voiceHelp()}
function openSheet(){const canInstall=deferredPrompt||(IS_SITE&&ENV.ios&&!ENV.standalone&&!ENV.inapp);
 $('#sheet').innerHTML=`<div class="sheet-in" role="dialog" aria-label="設定"><div class="row"><h2>設定</h2><button class="btn ghost" data-act="close">關閉</button></div>
 <div><div class="lab">日語語速</div><div class="seg">${[[0.6,'慢'],[0.8,'中'],[1,'正常']].map(r=>`<button class="${TTS.rate===r[0]?'on':''}" data-act="rate" data-v="${r[0]}">${r[1]}</button>`).join('')}</div></div>
 <label class="row chk"><span>答對後自動前往下一題</span><input type="checkbox" id="optAuto" ${S.auto?'checked':''}></label>
 <div class="voice"><div><b>日文語音</b><small>${esc(voiceStatus())}</small></div><button class="btn" data-act="test">測試聲音</button></div>
 ${(TTS.jaList||[]).length>1?`<label style="display:grid;gap:6px"><span class="lab" style="margin:0">選擇日文語音（聽起來不自然時可換）</span><select id="optVoice" style="min-height:46px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-weight:700">${TTS.jaList.map(v=>`<option value="${esc(v.name)}" ${TTS.ja&&TTS.ja.name===v.name?'selected':''}>${esc(v.name)}${v.localService?'':'（需網路）'}</option>`).join('')}</select></label>`:''}
 ${canInstall?'<button class="btn ghost" data-act="install">安裝到主畫面</button>':''}</div>`;
 $('#sheet').classList.remove('hidden');$('#optAuto').onchange=e=>{S.auto=e.target.checked;save()};const ov=$('#optVoice');if(ov)ov.onchange=e=>{S.voice=e.target.value;save();loadVoices();say('こんにちは。日本語の 勉強を はじめましょう。')}}
function closeSheet(){$('#sheet').classList.add('hidden')}

/* ---------- 事件 ---------- */
const ACT={sl:a=>{R.sl=a.dataset.v;$$('#sl .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===R.sl));renderSearch()},go:a=>go(a.dataset.to),pick:a=>pick(a.dataset.v),check:checkTyped,next:nextQ,
 reveal:()=>{R.rev=true;vFlash();say(R.q[R.i].reading,$('#view .spk'))},flashYes:()=>flashMark(true),flashNo:()=>flashMark(false),
 mL:a=>matchPick('L',a),mR:a=>matchPick('R',a),nextRound:()=>{R.i++;vMatch()},
 auto:toggleAuto,finish:()=>{markStep(R.L,R.step,100);if(R.step==='list'&&stepsFor(R.L).some(s=>s.k==='flash'))go('#/L'+R.L+'/flash');else go('#/L'+R.L)},retry:()=>startStep(R.L,R.step),lesson:()=>go('#/L'+R.L),nextStep:goNextStep,
 settings:openSheet,close:closeSheet,rate:a=>{TTS.rate=+a.dataset.v;S.rate=TTS.rate;save();openSheet();say('はじめまして')},
 test:()=>{say('こんにちは。日本語の 勉強を はじめましょう。');setTimeout(()=>{if($('#sheet:not(.hidden)'))openSheet()},1500)},
 install:installApp,copy:copyLink,dismiss:a=>dismissBanner(a.dataset.k),
 replay:()=>{const b=$('#view .qcard .spk');if(b)say(b.dataset.say,b)},
 replayFb:()=>{const b=$('#fb .spk');if(b){R.tok++;say(b.dataset.say,b)}}};
document.addEventListener('click',e=>{unlock();if(e.target.id==='sheet'){closeSheet();return}
 const s=e.target.closest('[data-say]'),a=e.target.closest('[data-act]');
 if(s&&(!a||a.contains(s))){if(s.closest('#fb'))R.tok++;say(s.dataset.say,s.classList.contains('spk')?s:s.querySelector('.spk'));return}
 if(a&&ACT[a.dataset.act])ACT[a.dataset.act](a)});
document.addEventListener('keydown',e=>{if(!$('#sheet').classList.contains('hidden')){if(e.key==='Escape')closeSheet();return}
 const inInput=e.target.tagName==='INPUT'&&e.target.type!=='checkbox';
 if(e.key==='Enter'){if(inInput&&R.step==='typing'&&!R.locked){e.preventDefault();checkTyped();return}
  const m=$('#mainBtn');if(m&&!m.disabled&&(!document.activeElement||document.activeElement.tagName!=='BUTTON')){e.preventDefault();m.click()}return}
 if(inInput)return;
 if(/^[1-4]$/.test(e.key)){const b=$$('.ans')[+e.key-1];if(b&&!b.disabled)b.click()}
 if(e.key===' '){const b=$('#view .spk');if(b){e.preventDefault();say(b.dataset.say,b)}}});
function route(){stopAll();closeSheet();const h=location.hash.replace(/^#\/?/,''),p=h.split('/');
 if(!h){vHome();window.scrollTo(0,0);return}if(h==='search'){vSearch();window.scrollTo(0,0);return}const L=p[0].replace(/^L/,'');
 if(!TITLES[L]){go('#/');return}
 if(p[1]&&stepsFor(L).some(s=>s.k===p[1])){if(L==='mist'&&!pool(L).length){vLesson(L);return}startStep(L,p[1])}else{vLesson(L);window.scrollTo(0,0)}}
window.addEventListener('hashchange',route);
route();setTimeout(checkEnv,1500);
if(IS_SITE&&'serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
